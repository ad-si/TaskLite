<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Task – TaskLite</title>
  <link rel="stylesheet" href="edit.css">
  <script src="edit.bundle.js" defer></script>
</head>
<body>
  <main id="editor"></main>
  <pre id="error" hidden></pre>

    <span class="hint">Set <code>state: x</code> to delete the task</span>

    <button id="save" type="button" disabled>Save</button>
  </footer>
</body>
</html>
