name: Haskell Stack CI

on: [push]

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13

      - name: Setup Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      # ~500 MB per platform, but only changes when the dependencies do,
      # so it is keyed on the package definitions instead of the commit
      - name: Cache Stack dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: >-
            ${{ matrix.os }}-${{ matrix.arch }}-stack-deps-${{
            hashFiles('stack.yaml.lock', 'tasklite/package.yaml',
            'tasklite-core/package.yaml') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-stack-deps-

      # Only ~20 MB, so a fresh copy per commit is affordable and
      # keeps incremental compilation working
      - name: Cache Stack build artifacts
        uses: actions/cache@v6
        with:
          path: .stack-work
          key: ${{ matrix.os }}-${{ matrix.arch }}-stack-work-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-stack-work-

      - name: Install TaskLite CLI tool
        # Retried, because fetching from hackage.haskell.org
        # intermittently fails on GitHub's runners
        run: |
          for attempt in 1 2 3; do
            stack --local-bin-path ./dist install tasklite && exit 0
            echo "::warning::stack install failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Run test suite
        run: stack test

      - name: Test adding of tasks
        run: ./dist/tasklite add Buy milk

      - name: Test listing of tasks
        run: ./dist/tasklite

      - name: Upload Release
        uses: actions/upload-artifact@v7
        with:
          path: ./dist/tasklite
          name: tasklite_${{ matrix.os }}_${{ matrix.arch }}

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only `main` and `v*` tags are published to Docker Hub.
      # Every other branch merely builds the image to verify the Dockerfile.
      - name: Determine image tags
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" != "ad-si/TaskLite" ]; then
            # Forks don't have the Docker Hub secrets
            echo 'push=false' >> "$GITHUB_OUTPUT"
            echo 'tags=adius/tasklite:ci' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REF" in
            refs/heads/main)
              echo 'push=true' >> "$GITHUB_OUTPUT"
              echo 'tags=adius/tasklite:latest' >> "$GITHUB_OUTPUT"
              ;;
            refs/tags/v*)
              echo 'push=true' >> "$GITHUB_OUTPUT"
              echo "tags=adius/tasklite:$REF_NAME,adius/tasklite:latest" \
                >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'push=false' >> "$GITHUB_OUTPUT"
              echo 'tags=adius/tasklite:ci' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Login to DockerHub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # `mode=max` is required, because the expensive
          # `stack install --only-dependencies` layer lives in the
          # `builder` stage and is not part of the exported image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

