# ATTENTION: Also use the corresponding GHC version in the Dockerfile
resolver: lts-24.27
system-ghc: true  # Installed via Nix

packages:
  - tasklite
  - tasklite-core

extra-deps:
  - aeson-2.2.1.0
  - double-x-encoding-1.2.1
  - fuzzily-0.2.1.0
  - graphql-spice-1.0.5.0
  - time-hourglass-0.3.0

  # Echoes the client-requested protocol version during negotiation
  # (e.g. 2025-11-25) instead of forcing the hardcoded 2025-06-18, which made
  # clients like Claude Code warn about an unsupported protocol version.
  - mcp-server-0.1.0.20

  - purebred-email-0.7

  # Unreleased fix for parsing the untyped `sqlite_stat1` and `sqlite_stat4`
  # tables created by `ANALYZE`. Use the Hackage release once available.
  - github: Airsequel/AirGQL
    commit: c209edca09696a909d066d4f5ae5cbef53d15d0b

  - github: Airsequel/simple-sql-parser
    commit: ab82249523cd6a68ca9481b2de8436f89eca56db

  - github: meteogrid/iso8601-duration
    commit: 9524d1f02775be1d6c73165c4b4d62a19c8b7698

allow-newer: true

flags:
  aeson-pretty:
    lib-only: true

  airgql:
    lib-only: true

# Build TaskLite in a container
# docker:
#   repo: fpco/stack-build

# Copy executable to new image
# image:
#   containers:
#     - base: haskell-datasette
#       name: adius/tasklite
#       entrypoints:
#         - tasklite
